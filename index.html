<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="酵母工作台" />
  <meta name="theme-color" content="#2f7d4f" />
  <title>酵母工作台 · Yeast Workbench</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- 顶部应用栏 -->
  <header class="appbar">
    <div class="appbar-brand"><span class="logo">🧫</span><span>酵母工作台</span></div>
    <div class="appbar-status" id="dbStatus">本地存储：就绪</div>
  </header>

  <!-- 主体：左侧导航 + 右侧内容 -->
  <div class="body-row">
    <aside class="sidebar" id="nav">
      <button class="tab-btn active" data-view="strains">
        <span class="tab-ico">🧫</span><span class="tab-lbl">菌株</span>
      </button>
      <button class="tab-btn" data-view="eln">
        <span class="tab-ico">📓</span><span class="tab-lbl">实验</span>
      </button>
      <button class="tab-btn" data-view="cloning">
        <span class="tab-ico">🔧</span><span class="tab-lbl">工具</span>
      </button>
      <button class="tab-btn" data-view="backup">
        <span class="tab-ico">💾</span><span class="tab-lbl">备份</span>
      </button>
    </aside>

    <!-- 主内容（仅此区域滚动） -->
    <main id="app" class="app"><!-- 视图挂载点 --></main>
  </div>

  <!-- 模态框容器 -->
  <div id="modalRoot" class="modal-root hidden"></div>

  <script src="js/seqcore.js"></script>
  <script src="js/db.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/strains.js"></script>
  <script src="js/eln.js"></script>
  <script src="js/cloning.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
